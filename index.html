<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17664a" />
    <meta name="description" content="Francanglais Studio: a compiler construction workspace for Cameroonian Francanglais." />
    <title>Francanglais Studio</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Francanglais Studio" />
    <meta property="og:description" content="Lexical and syntactic analysis of Cameroonian Francanglais." />
    <meta property="og:image" content="/logo-192.png" />
    <meta property="og:type" content="website" />
    <script>
      // Applies the stored theme before first paint so dark-mode loads never flash white.
      (function () {
        try {
          var stored = localStorage.getItem('francanglais-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* storage unavailable: fall through to the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
